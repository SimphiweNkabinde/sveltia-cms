# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

backend:
  name: github
  repo: SimphiweNkabinde/sveltia-cms

media_folder: /public/media
public_folder: /media

collections:
  - name: posts
    label: Posts
    label_singular: Post
    folder: /content/posts
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Date, name: date, widget: datetime, type: date }
      - { label: Body, name: body, widget: richtext }
  - name: Pages
    label: Pages
    label_singular: Page
    folder: /content/pages
    fields:
      - {label: Title, name: title}
      - {label: Description, name: description, widget: richtext }
      - {label: Content (HTML), name: content, widget: code, allow_language_selection: false, default_language: html}
